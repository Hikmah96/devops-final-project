name: DevOps Final Project CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT SOURCE CODE
      # ============================================================

      - name: Checkout code
        uses: actions/checkout@v4


      # ============================================================
      # 2. BUILD DOCKER APPLICATIONS
      # ============================================================

      - name: Build Docker images
        run: docker compose build

      - name: Show Docker images
        run: docker images


      # ============================================================
      # 3. SETUP TERRAFORM
      # ============================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ============================================================
      # 4. TERRAFORM INITIALIZATION
      # ============================================================

      - name: Terraform Init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: terraform init


      # ============================================================
      # 5. TERRAFORM VALIDATION
      # ============================================================

      - name: Terraform Validate
        run: terraform validate


      # ============================================================
      # 6. TERRAFORM PLAN
      # ============================================================

      - name: Terraform Plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: terraform plan


      # ============================================================
      # 7. INSTALL ANSIBLE
      # ============================================================

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible


      # ============================================================
      # 8. CREATE SSH PRIVATE KEY
      # ============================================================

      - name: Create SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_SSH_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem


      # ============================================================
      # 9. TEST ANSIBLE CONNECTION
      # ============================================================

      - name: Test Ansible connection
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          ansible all \
            -i "$EC2_HOST," \
            -u ec2-user \
            --private-key ec2_key.pem \
            -m ping \
            --ssh-extra-args="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"


      # ============================================================
      # 10. RUN ANSIBLE DEPLOYMENT
      # ============================================================

      - name: Deploy applications with Ansible
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          ansible-playbook \
            -i ansible/inventory \
            ansible/playbook.yml \
            -e "ansible_host=$EC2_HOST" \
            -e "ansible_private_key_file=./ec2_key.pem" \
            -e 'ansible_ssh_common_args="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"'


      # ============================================================
      # 11. VERIFY PORTFOLIO APPLICATION
      # ============================================================

      - name: Verify Portfolio Application
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          curl --fail --retry 5 --retry-delay 5 "http://$EC2_HOST:8080"


      # ============================================================
      # 12. VERIFY JAVA APPLICATION
      # ============================================================

      - name: Verify Java Application
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          curl --fail --retry 5 --retry-delay 5 "http://$EC2_HOST:8081/sampleapp/"
