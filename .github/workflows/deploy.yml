name: DevOps Final Project CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform plan

      - name: Terraform Apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform apply -auto-approve

      - name: Get EC2 public IP
        id: ec2ip
        run: |
          echo "EC2_HOST=$(terraform output -raw server_public_ip)" >> "$GITHUB_ENV"

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Create SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/devops-final-key.pem
          chmod 600 ~/.ssh/devops-final-key.pem

      - name: Wait for EC2 SSH to become available
        run: |
          for i in $(seq 1 30); do
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/devops-final-key.pem ec2-user@${EC2_HOST} "echo ready" && exit 0
            sleep 10
          done
          echo "EC2 instance did not become reachable in time" >&2
          exit 1

      - name: Configure EC2 server with Ansible
        run: |
          ansible-playbook \
            -i ansible/inventory \
            ansible/playbook.yml \
            -e "ansible_host=${EC2_HOST}" \
            -e "ansible_user=ec2-user" \
            -e "ansible_private_key_file=~/.ssh/devops-final-key.pem" \
            -e 'ansible_ssh_common_args="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"'

      - name: Verify Portfolio Application
        run: |
          curl --fail --retry 20 --retry-delay 10 "http://${EC2_HOST}:8080"

      - name: Verify Java Application
        run: |
          curl --fail --retry 20 --retry-delay 10 "http://${EC2_HOST}:8081/sampleapp/"
